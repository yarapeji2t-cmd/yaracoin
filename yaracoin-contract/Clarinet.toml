[project]
name = 'yaracoin-contract'
description = 'YaraCoin (YARA) - A decentralized cryptocurrency token built on Stacks blockchain'
authors = ['YaraCoin Team']
telemetry = true
cache_dir = './.cache'
requirements = []
[contracts.yaracoin]
path = 'contracts/yaracoin.clar'
clarity_version = 3
epoch = 'latest'
[repl.analysis]
passes = ['check_checker']

[repl.analysis.check_checker]
strict = false
trusted_sender = false
trusted_caller = false
callee_filter = false

[repl.remote_data]
enabled = false
api_url = 'https://api.hiro.so'
